    <label>Select Country</label>

      <option value="VN">Vietnam - SPX</option>
      <option value="TH">Thailand - SPX</option>
      <option value="SG">Singapore - SPX</option>
    </select>

    <label>CSV Encoding</label>
    <select id="encoding">
      <option value="UTF-8">UTF-8</option>
      <option value="windows-1258">Windows-1258 Vietnamese</option>
      <option value="ISO-8859-1">ISO-8859-1</option>

    <label>Upload Shopify Order Report CSV</label>
    <input type="file" id="csvFile" accept=".csv">

    <button onclick="generateTemplate()">Generate Template</button>

      Default parcel setting: 2KG, 14cm x 28cm x 36cm.<br>

    function cleanOutputText(value) {
      return (value || "")
        .toString()
        .replace(/[\u200B-\u200D\uFEFF\u2060]/g, " ")
        .replace(/\b(None|null|undefined)\b/gi, "")
        .replace(/\s+/g, " ")
        .replace(/\s*,\s*/g, ", ")
        .replace(/,\s*,+/g, ", ")
        .replace(/^,\s*|\s*,\s*$/g, "")
        .trim();
    }

    function normalizeText(text) {
      return cleanOutputText(text)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function removeAdminPrefix(text) {
      return normalizeText(text)
        .replace(/^thanh pho\s+/, "")
        .replace(/^tinh\s+/, "")
        .replace(/^phuong\s+/, "")
        .replace(/^xa\s+/, "")
        .replace(/^thi tran\s+/, "")
        .trim();
    }

    function getValue(row, key) {
      const value = row[key];
      if (value === undefined || value === null) return "";
      return cleanOutputText(value);
    }

    function getRealShopifyId(row) {
      return getValue(row, "Id") || getValue(row, "ID") || getValue(row, "Order ID");
    }

    function cleanPhone(phone) {
      return (phone || "").toString().replace(/[^0-9+]/g, "");
    }

    function cleanDigits(value) {
      return (value || "").toString().replace(/\D/g, "");
    }

    function cleanPostalCode(value) {
      return cleanDigits(value);
    }

    function cleanSingaporePhone(phone) {
      let digits = cleanDigits(phone);
      if (digits.startsWith("0065") && digits.length > 8) digits = digits.slice(4);
      if (digits.startsWith("65") && digits.length === 10) digits = digits.slice(2);
      return digits;
    }

    function cleanSingaporePostalCode(value) {
      const digits = cleanPostalCode(value);
      if (digits && digits.length < 6) return digits.padStart(6, "0");
      return digits;
    }

    function cleanNumber(value) {
      if (!value) return 0;
      return Number(value.toString().replace(/[^0-9.-]/g, "")) || 0;
    }

    function buildAddress(row) {
      return cleanOutputText([
        getValue(row, "Shipping Address1"),
        getValue(row, "Shipping Address2"),
        getValue(row, "Shipping City")
      ].filter(Boolean).join(", "));
    }

    function shortProductName(items, totalQty) {
      let productName = items.map(item => `${item.name} x ${item.qty}`).join("; ");
      if (productName.length > 250) {
        productName = `Skechers footwear - ${items.length} styles / ${totalQty} pairs`;
      }
      return productName;
    }

    function groupShopifyOrders(shopifyRows) {
      const orders = {};
      let lastOrderId = "";
      const hasRealId = shopifyRows.some(row => getRealShopifyId(row));

      shopifyRows.forEach(row => {
        let orderNo = "";

        if (hasRealId) {
          const realId = getRealShopifyId(row);
          if (realId) lastOrderId = realId;
          orderNo = realId || lastOrderId;
        } else {
          orderNo = getValue(row, "Name");
        }

        if (!orderNo) return;
        if (!orders[orderNo]) orders[orderNo] = { orderNo, base: row, items: [] };

        const qty = cleanNumber(getValue(row, "Lineitem quantity")) || 1;
        const price = cleanNumber(getValue(row, "Lineitem price"));
        const itemName = getValue(row, "Lineitem name") || getValue(row, "Lineitem sku") || "Skechers product";

        orders[orderNo].items.push({ name: itemName, qty, price });
      });

      return Object.values(orders);
    }

    function normalizeLatinKey(value) {
      return cleanOutputText(value)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    const thProvinceByEnglish = Object.values(thProvinceData).reduce((map, entry) => {
      map[normalizeLatinKey(entry[0])] = entry[1];
      return map;
    }, {});

    const thCityAliases = {
      "pai": "ปาย"
    };

    const thSubdistrictAliases = {
      "tungyao": "ทุ่งยาว",
      "tung yao": "ทุ่งยาว"
    };

    function parseCsvFile(file, encoding) {
      return new Promise((resolve, reject) => {
        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          encoding: encoding,
          complete: function(results) { resolve(results.data); },
          error: function(error) { reject(error); }
        });
      });
    }

    function getFullAddressText(row) {
      return [
        getValue(row, "Shipping Name"),
        getValue(row, "Shipping Address1"),
        getValue(row, "Shipping Address2"),
        getValue(row, "Shipping Street"),
        getValue(row, "Shipping City"),
        getValue(row, "Shipping Province"),
        getValue(row, "Shipping Province Name"),
        getValue(row, "Shipping Zip")
      ].join(" ");
    }

    function prepareAddressDb() {
      const addressDb = (window.VN_ADDRESS_DB || []).map(item => {
        const province = cleanOutputText(item.province);
        const ward = cleanOutputText(item.ward);
        return {
          province,
          ward,
          provinceNorm: normalizeText(province),
          provinceCore: removeAdminPrefix(province),
          wardNorm: normalizeText(ward),
          wardCore: removeAdminPrefix(ward)
        };
      });

      const stateList = (window.VN_STATE_LIST || []).map(state => ({
        state: cleanOutputText(state),
        stateNorm: normalizeText(state),
        stateCore: removeAdminPrefix(state)
      }));

      return { addressDb, stateList };
    }

    function scoreWardCandidate(normalizedText, entry) {
      const core = entry.wardCore;
      const wardNorm = entry.wardNorm;
      if (!core || core.length < 3) return 0;

      let score = 0;

      if (normalizedText.includes(wardNorm)) score += 900 + wardNorm.length;
      if (normalizedText.includes(core)) score += 350 + core.length;

      if (
        normalizedText.includes("phuong " + core) ||
        normalizedText.includes("xa " + core) ||
        normalizedText.includes(core + " ward") ||
        normalizedText.includes("ward " + core)
      ) {
        score += 1000;
      }

      return score;
    }

    function inferProvinceByAlias(normalizedText) {
      const aliases = [
        { keys: ["hcm", "tp hcm", "tphcm", "ho chi minh"], province: "Thành phố Hồ Chí Minh" },
        { keys: ["ha noi", "hanoi"], province: "Thành phố Hà Nội" },
        { keys: ["da nang"], province: "Thành phố Đà Nẵng" },
        { keys: ["can tho"], province: "Thành phố Cần Thơ" },
        { keys: ["hai phong"], province: "Thành phố Hải Phòng" },
        { keys: ["hue"], province: "Thành phố Huế" },
        { keys: ["buon ma thuot", "dak lak", "daklak", "đắk lắk"], province: "Tỉnh Đắk Lắk" }
      ];

      for (const alias of aliases) {
        for (const key of alias.keys) {
          if (normalizedText.includes(normalizeText(key))) return alias.province;
        }
      }

      return "";
    }

    function mapProvince(row, addressDb, stateList) {
      const normalized = normalizeText(getFullAddressText(row));

      const aliasProvince = inferProvinceByAlias(normalized);
      if (aliasProvince) return aliasProvince;

      const sortedStates = [...stateList].sort((a, b) => b.stateCore.length - a.stateCore.length);
      for (const state of sortedStates) {
        if (state.stateCore && state.stateCore.length >= 3 && normalized.includes(state.stateCore)) {
          return state.state;
        }
      }

      return "NEED CHECK";
    }

    function mapWard(row, province, addressDb) {
      const normalized = normalizeText(getFullAddressText(row));
      let candidates = addressDb;

      if (province && province !== "NEED CHECK") {
        candidates = candidates.filter(item => item.province === province);
      }

      const matched = candidates
        .map(item => ({ item, score: scoreWardCandidate(normalized, item) }))
        .filter(match => match.score > 0)
        .sort((a, b) => b.score - a.score);

      if (!matched.length) return "NEED CHECK";

      const bestScore = matched[0].score;
      const topMatches = matched.filter(match => match.score === bestScore);
      const uniqueWards = [...new Set(topMatches.map(match => match.item.ward))];

      if (uniqueWards.length === 1) return topMatches[0].item.ward;
      return "NEED CHECK";
    }

    function buildVietnamRows(shopifyRows, addressDb, stateList) {
      const orders = {};
      let lastOrderId = "";
      const hasRealId = shopifyRows.some(row => getRealShopifyId(row));

      shopifyRows.forEach(row => {
        let orderNo = "";

        if (hasRealId) {
          const realId = getRealShopifyId(row);
          if (realId) lastOrderId = realId;
          orderNo = realId || lastOrderId;
        } else {
          orderNo = getValue(row, "Name");
        }

        if (!orderNo) return;

        if (!orders[orderNo]) orders[orderNo] = { base: row, items: [] };

        const qty = cleanNumber(getValue(row, "Lineitem quantity")) || 1;
        const price = cleanNumber(getValue(row, "Lineitem price"));
        const itemName = getValue(row, "Lineitem name") || getValue(row, "Lineitem sku") || "Skechers product";

        orders[orderNo].items.push({ name: itemName, qty, price });
      });

      const outputRows = [];
      const warnings = [];

      Object.keys(orders).forEach(orderNo => {
        const order = orders[orderNo];
        const base = order.base;
        const items = order.items;

        const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
        const totalProductPrice = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
        const productName = shortProductName(items, totalQty);

        const receiverName = getValue(base, "Shipping Name") || getValue(base, "Billing Name");
        const phone = cleanPhone(getValue(base, "Shipping Phone") || getValue(base, "Billing Phone") || getValue(base, "Phone"));
        const province = mapProvince(base, addressDb, stateList);
        const ward = mapWard(base, province, addressDb);
        const address = buildAddress(base);
        const orderValue = cleanNumber(getValue(base, "Total")) || totalProductPrice;

        if (!receiverName) warnings.push(`${orderNo}: missing receiver name`);
        if (!phone) warnings.push(`${orderNo}: missing phone`);
        if (!address) warnings.push(`${orderNo}: missing address`);
        if (province === "NEED CHECK") warnings.push(`${orderNo}: province needs checking`);
        if (ward === "NEED CHECK") warnings.push(`${orderNo}: ward needs checking`);

        outputRows.push([
          orderNo,
          receiverName,
          phone,
          province,
          ward,
          address,
          "",
          "",
          productName,
          totalQty,
          totalProductPrice,
          2,
          14,
          28,
          36,
          orderNo,
          orderValue,
          "N",
          "N",
          "Y",
          "N",
          "",
          "N",
          "",
          "N",
          "Người gửi trả",
          "",
          "",
          ""
        ]);
      });

      return { outputRows, warnings };
    }

    function cleanThaiPhone(phone) {
      let digits = cleanDigits(phone);
      if (digits.startsWith("0066") && digits.length > 9) {
        const local = digits.slice(4);
        digits = local.startsWith("0") ? local : "0" + local;
      }
      if (digits.startsWith("66") && digits.length >= 11) {
        const local = digits.slice(2);
        digits = local.startsWith("0") ? local : "0" + local;
      }
      return digits;
    }

    function mapThaiProvince(row) {
      let code = getValue(row, "Shipping Province").toUpperCase().replace(/_/g, "-");
      if (/^\d{2}$/.test(code)) code = "TH-" + code;
      if (thProvinceData[code]) return thProvinceData[code][1];

      const provinceName = getValue(row, "Shipping Province Name") || getValue(row, "Shipping Province");
      if (/[\u0E00-\u0E7F]/.test(provinceName)) {
        return cleanOutputText(provinceName).replace(/^จังหวัด\s*/u, "");
      }

      return thProvinceByEnglish[normalizeLatinKey(provinceName)] || "NEED CHECK";
    }

    function mapThaiCity(row) {
      const rawCity = getValue(row, "Shipping City") || getValue(row, "Billing City");
      if (!rawCity) return "NEED CHECK";

      if (/[\u0E00-\u0E7F]/.test(rawCity)) {
        return cleanOutputText(rawCity)
          .replace(/^(อำเภอ|เขต)\s*/u, "")
          .trim();
      }

      const key = normalizeLatinKey(rawCity)
        .replace(/^(amphoe|district)\s+/, "")
        .trim();
      return thCityAliases[key] || cleanOutputText(rawCity);
    }

    function extractThaiSubdistrict(row, city) {
      const addressText = cleanOutputText([
        getValue(row, "Shipping Address1"),
        getValue(row, "Shipping Address2"),
        getValue(row, "Shipping Street")
      ].filter(Boolean).join(", "));

      const thaiMatch = addressText.match(
        /(?:^|[\s,])(?:ต\.|ตำบล|แขวง)\s*([^,]+?)(?=\s+(?:อ\.|อำเภอ|เขต|จ\.|จังหวัด)|,|$)/u
      );

      if (thaiMatch) {
        const subdistrict = cleanOutputText(thaiMatch[1])
          .replace(/^(ตำบล|แขวง)\s*/u, "")
          .trim();
        if (subdistrict) return { value: subdistrict, inferred: false };
      }

      const normalizedAddress = normalizeLatinKey(addressText);
      for (const [alias, mapped] of Object.entries(thSubdistrictAliases)) {
        if (normalizedAddress.includes(alias)) return { value: mapped, inferred: false };
      }

      return { value: city, inferred: true };
    }

    function buildThailandRows(shopifyRows) {
      const orders = groupShopifyOrders(shopifyRows);
      const outputRows = [];
      const warnings = [];

      orders.forEach(order => {
        const { orderNo, base, items } = order;
        const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
        const totalProductPrice = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
        const productName = shortProductName(items, totalQty);

        const receiverName = getValue(base, "Shipping Name") || getValue(base, "Billing Name");
        const phone = cleanThaiPhone(
          getValue(base, "Shipping Phone") || getValue(base, "Billing Phone") || getValue(base, "Phone")
        );
        const detailAddress = buildAddress(base);
        const city = mapThaiCity(base);
        const province = mapThaiProvince(base);
        const { value: subdistrict, inferred: subdistrictInferred } = extractThaiSubdistrict(base, city);
        const postalCode = cleanPostalCode(getValue(base, "Shipping Zip") || getValue(base, "Billing Zip"));
        const orderValue = cleanNumber(getValue(base, "Total")) || totalProductPrice;
        const deliveryInstruction = getValue(base, "Notes");

        if (!receiverName) warnings.push(`${orderNo}: missing receiver name`);
        if (!phone) warnings.push(`${orderNo}: missing phone`);
        else if (!/^\d{9,10}$/.test(phone)) warnings.push(`${orderNo}: phone format needs checking`);
        if (!detailAddress) warnings.push(`${orderNo}: missing detail address`);
        if (!subdistrict || subdistrict === "NEED CHECK") warnings.push(`${orderNo}: sub-district needs checking`);
        else if (subdistrictInferred) warnings.push(`${orderNo}: sub-district inferred from city; please verify`);
        if (!city || city === "NEED CHECK") warnings.push(`${orderNo}: city needs checking`);
        else if (!/[\u0E00-\u0E7F]/.test(city)) warnings.push(`${orderNo}: city is not in Thai; please verify`);
        if (!province || province === "NEED CHECK") warnings.push(`${orderNo}: province needs checking`);
        if (!/^\d{5}$/.test(postalCode)) warnings.push(`${orderNo}: postal code needs checking`);
        if (orderValue <= 0) warnings.push(`${orderNo}: parcel value needs checking`);

        outputRows.push([
          receiverName,
          phone,
          detailAddress,
          subdistrict,
          city,
          province,
          postalCode,
          2,
          14,
          28,
          36,
          productName,
          totalQty,
          cleanOutputText(orderNo).replace(/^#/, ""),
          "ชำระโดยผู้ส่ง",
          "N",
          "",
          "N",
          orderValue,
          deliveryInstruction
        ]);
      });

      return { outputRows, warnings };
    }

    function splitSingaporeAddress(row) {
      const rawParts = [
        getValue(row, "Shipping Address1"),
        getValue(row, "Shipping Address2"),
        getValue(row, "Shipping Company")
      ].filter(Boolean);

      const city = getValue(row, "Shipping City");
      if (
        city &&
        normalizeLatinKey(city) !== "singapore" &&
        !rawParts.some(part => normalizeLatinKey(part).includes(normalizeLatinKey(city)))
      ) {
        rawParts.push(city);
      }

      let unitNo = "";
      const unitPattern = /(?:#|unit\s*)\s*(\d{1,3}[a-z]?)\s*[-/]\s*(\d{1,5}[a-z]?)/i;
      const streetParts = rawParts.map(part => {
        if (unitNo) return part;
        const match = part.match(unitPattern);
        if (!match) return part;

        unitNo = `#${match[1].toUpperCase()}-${match[2].toUpperCase()}`;
        return cleanOutputText(
          part
            .replace(match[0], "")
            .replace(/^[,\s]+|[,\s]+$/g, "")
        );
      }).filter(Boolean);

      return {
        street: cleanOutputText(streetParts.join(", ")),
        unitNo
      };
    }

    function buildSingaporeRows(shopifyRows) {
      const orders = groupShopifyOrders(shopifyRows);
      const outputRows = [];
      const warnings = [];

      orders.forEach(order => {
        const { orderNo, base, items } = order;
        const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
        const totalProductPrice = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
        const productName = shortProductName(items, totalQty);

        const receiverName = getValue(base, "Shipping Name") || getValue(base, "Billing Name");
        const phone = cleanSingaporePhone(
          getValue(base, "Shipping Phone") || getValue(base, "Billing Phone") || getValue(base, "Phone")
        );
        const postalCode = cleanSingaporePostalCode(
          getValue(base, "Shipping Zip") || getValue(base, "Billing Zip")
        );
        const { street, unitNo } = splitSingaporeAddress(base);
        const orderValue = cleanNumber(getValue(base, "Total")) || totalProductPrice;
        const deliveryInstruction = getValue(base, "Notes");
        const reference = cleanOutputText(orderNo).replace(/^#/, "");

        if (!receiverName) warnings.push(`${orderNo}: missing receiver name`);
        if (!phone) warnings.push(`${orderNo}: missing phone`);
        else if (!/^\d{8}$/.test(phone)) warnings.push(`${orderNo}: Singapore phone must contain 8 digits`);
        if (!postalCode) warnings.push(`${orderNo}: missing postal code`);
        else if (!/^\d{6}$/.test(postalCode)) warnings.push(`${orderNo}: Singapore postal code must contain 6 digits`);
        if (!street) warnings.push(`${orderNo}: missing street name/building`);
        if (!reference) warnings.push(`${orderNo}: missing customer reference number`);
        if (orderValue <= 0) warnings.push(`${orderNo}: parcel value needs checking`);

        outputRows.push([
          receiverName,
          phone,
          postalCode,
          street,
          unitNo,
          2,
          14,
          28,
          36,
          productName,
          totalQty,
          reference,
          orderValue,
          deliveryInstruction
        ]);
      });

      return { outputRows, warnings };
    }

    function writeMappedWorkbook(headers, outputRows, sheetName, fileName, columnWidths, textColumnIndexes) {
      const workbook = XLSX.utils.book_new();
      const worksheet = XLSX.utils.aoa_to_sheet([headers, ...outputRows]);

      worksheet["!cols"] = columnWidths.map(width => ({ wch: width }));
      worksheet["!rows"] = [{ hpt: 30 }];

      for (let rowIndex = 1; rowIndex <= outputRows.length; rowIndex += 1) {
        textColumnIndexes.forEach(columnIndex => {
          const cellAddress = XLSX.utils.encode_cell({ r: rowIndex, c: columnIndex });
          const cell = worksheet[cellAddress];
          if (!cell || cell.v === null || cell.v === undefined || cell.v === "") return;
          cell.v = String(cell.v);
          cell.t = "s";
          cell.z = "@";
          cell.w = cell.v;
        });
      }

      XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
      XLSX.writeFile(workbook, fileName);
    }

    function updateCountryNote() {
      const country = document.getElementById("country").value;
      document.getElementById("countryNote").innerHTML = countryNotes[country].join("<br>");
    }

    function normalizeCountryCode(value) {
      const normalized = cleanOutputText(value).toUpperCase();
      if (normalized === "VIETNAM") return "VN";
      if (normalized === "THAILAND") return "TH";
      if (normalized === "SINGAPORE") return "SG";
      return normalized;
    }

    async function generateTemplate() {
      const country = document.getElementById("country").value;
      const encoding = document.getElementById("encoding").value;
      const csvInput = document.getElementById("csvFile");
      const resultBox = document.getElementById("result");

      resultBox.style.display = "block";
      resultBox.className = "result";
      resultBox.innerText = "Processing...";

      try {
        if (!csvInput.files.length) {
          resultBox.className = "result error";
          resultBox.innerText = "Please upload Shopify order report CSV first.";
          return;
        }

        const shopifyRows = await parseCsvFile(csvInput.files[0], encoding);
        const reportCountries = [...new Set(
          shopifyRows
            .map(row => normalizeCountryCode(getValue(row, "Shipping Country")))
            .filter(Boolean)
        )];

        if (reportCountries.length > 0 && !reportCountries.includes(country)) {
          resultBox.className = "result error";
          resultBox.innerText =
            `Country mismatch: you selected ${country}, but the Shopify report contains ${reportCountries.join(", ")} orders.`;
          return;
        }

        let outputRows = [];
        let warnings = [];
        let headers = [];
        let sheetName = "";
        let fileName = "";
        let columnWidths = [];
        let textColumnIndexes = [];

        if (country === "VN") {
          if (!window.VN_ADDRESS_DB || !window.VN_STATE_LIST) {
            resultBox.className = "result error";
            resultBox.innerText = "VN address database is missing. Please add vn-address-db.js into the same GitHub repository.";
            return;
          }

          const { addressDb, stateList } = prepareAddressDb();
          ({ outputRows, warnings } = buildVietnamRows(shopifyRows, addressDb, stateList));
          headers = vnHeaders;
          sheetName = "Tạo đơn (địa chỉ mới)";
          fileName = "SPX_Vietnam_Mapped_Template.xlsx";
          columnWidths = [
            20, 24, 16, 26, 26, 60, 20, 12, 60, 12,
            14, 14, 12, 12, 12, 20, 16, 14, 14, 18,
            18, 18, 12, 14, 18, 18, 24, 28, 32
          ];
          textColumnIndexes = [0, 2, 7, 15];
        } else if (country === "TH") {
          ({ outputRows, warnings } = buildThailandRows(shopifyRows));
          headers = thHeaders;
          sheetName = "Mass Order Creation-TH";
          fileName = "SPX_Thailand_Mapped_Template.xlsx";
          columnWidths = [
            26, 22, 60, 24, 24, 24, 16, 18, 18, 18,
            18, 60, 16, 28, 22, 24, 20, 24, 20, 42
          ];
          textColumnIndexes = [1, 6, 13];
        } else if (country === "SG") {
          ({ outputRows, warnings } = buildSingaporeRows(shopifyRows));
          headers = sgHeaders;
          sheetName = "Mass Order Creation - SG";
          fileName = "SPX_Singapore_Mapped_Template.xlsx";
          columnWidths = [
            18, 16, 14, 42, 16, 18, 18,
            18, 18, 50, 14, 28, 18, 42
          ];
          textColumnIndexes = [1, 2, 11];
        }

        if (outputRows.length === 0) {
          resultBox.className = "result error";
          resultBox.innerText = "No valid orders found. Please check whether this is the correct Shopify order report CSV.";
          return;
        }

        writeMappedWorkbook(
          headers,
          outputRows,
          sheetName,
          fileName,
          columnWidths,
          textColumnIndexes
        );

        let message = `Generated successfully.\nTotal orders: ${outputRows.length}\nDownloaded file: ${fileName}`;
        if (warnings.length > 0) {
          message += `\n\nNeed checking:\n- ${warnings.join("\n- ")}`;
        } else {
          message += "\n\nNo mapping warnings detected. Please still test upload in SPX before live operation.";
        }

        resultBox.innerText = message;
      } catch (error) {
        resultBox.className = "result error";
        resultBox.innerText = "Generation failed: " + error.message;
      }
    }

    document.getElementById("country").addEventListener("change", updateCountryNote);
    updateCountryNote();
  </script>
